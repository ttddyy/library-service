services:
  postgres:
    image: postgres:17
    container_name: postgres-db
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    restart: always
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: password
      # Spring Boot docker compose support (dev profile) connects to this db
      POSTGRES_DB: library_service_dev
    ports:
      - 5432:5432
    volumes:
      - pgdata:/var/lib/postgresql/data
      # scripts here run only when the volume is first initialized (creates library_service)
      - ./init:/docker-entrypoint-initdb.d

  adminer:
    container_name: adminer
    image: adminer
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    restart: always
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      - postgres
    ports:
      - 8888:8080

volumes:
  pgdata:
